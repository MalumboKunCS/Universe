<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Stall QR Codes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<style>
  body { font-family: sans-serif; background: #fff; padding: 20px; }
  .sheet { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; }
  .card {
    border: 2px dashed #999;
    border-radius: 10px;
    padding: 24px;
    text-align: center;
    page-break-inside: avoid;
  }
  .card h2 { margin: 0 0 4px; font-size: 22px; }
  .card img.flag { width: 40px; border: 1px solid #ccc; margin-bottom: 10px; }
  .card .qr { display: flex; justify-content: center; margin: 10px 0; }
  .card p { font-size: 12px; color: #555; }
  @media print { .no-print { display: none; } }
</style>
</head>
<body>

<p class="no-print"><strong>Admin only:</strong> print (Ctrl/Cmd+P) </p>

<div class="sheet" id="sheet"></div>

<script>
const base = `${location.origin}${location.pathname.replace('print-stall-qrs.html','')}collect.html`;

COUNTRIES.forEach(c => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <img class="flag" src="${c.badge}" alt="${c.name} stamp">
    <h2>${c.name}</h2>
    <div class="qr" id="qr-${c.code}"></div>
    <p>Scan to collect your stamp</p>
  `;
  document.getElementById('sheet').appendChild(card);

  new QRCode(document.getElementById(`qr-${c.code}`), {
    text: `${base}?stall=${c.code}`,
    width: 160,
    height: 160
  });
});
</script>

</body>
</html>
