<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Your Passport</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
</head>
<body>

<div class="passport-cover">
  <p class="eyebrow">World Stalls Event</p>
  <h1>Your Passport</h1>
  <p class="subtitle">Register once to get your travel ID.<br>Then visit every country stall to collect its stamp.</p>

  <div id="form-step">
    <label for="name">Your name</label>
    <input type="text" id="name" placeholder="e.g. Malumbo Kunda" autocomplete="name">
    <button id="register-btn">Issue My Passport</button>
    <p class="hint" id="form-hint"></p>
  </div>

  <div id="result-step" style="display:none;">
    <p class="progress-line">Welcome aboard</p>
    <p class="id-code" id="id-display"></p>
    <div id="qr-holder"></div>
    <p class="hint">This QR code is your passport. Save this page or screenshot the QR — you'll use it to get back here on any device.</p>
    <a class="link-btn" href="#" id="continue-link">Go to my passport &rarr;</a>
  </div>
</div>

<script>
document.getElementById('register-btn').addEventListener('click', async () => {
  const name = document.getElementById('name').value.trim();
  const btn = document.getElementById('register-btn');
  const hint = document.getElementById('form-hint');

  btn.disabled = true;
  btn.textContent = 'Issuing…';
  hint.textContent = '';

  try {
    const res = await fetch(`${API_URL}?action=register&name=${encodeURIComponent(name)}`);
    const data = await res.json();

    if (data.error) throw new Error(data.error);

    localStorage.setItem('passportId', data.id);

    document.getElementById('form-step').style.display = 'none';
    document.getElementById('result-step').style.display = 'block';
    document.getElementById('id-display').textContent = data.id;

    const passportUrl = `${location.origin}${location.pathname.replace('index.html','')}passport.html?id=${data.id}`;
    new QRCode(document.getElementById('qr-holder'), {
      text: passportUrl,
      width: 180,
      height: 180,
      colorDark: '#1B3A57',
      colorLight: '#FBF6E9'
    });
    document.getElementById('continue-link').href = passportUrl;
  } catch (err) {
    hint.textContent = 'Something went wrong — please try again. (' + err.message + ')';
    btn.disabled = false;
    btn.textContent = 'Issue My Passport';
  }
});
</script>

</body>
</html>
